
name: Docker

# Déclenchement du workflow
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # JOB 1 : Vérifier que les tests passent
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt
      - run: pytest


  # JOB 2 : Construire et publier l'image Docker
  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # Préparer Docker Buildx
      - uses: docker/setup-buildx-action@v4

      # Se connecter à GitHub Container Registry
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mettre le nom du propriétaire en minuscules
      - name: Définir le nom de l'image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> $GITHUB_ENV

      # Définir la version de l'application
      - name: Définir la version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "APP_VERSION=dev" >> $GITHUB_ENV
          fi

      # Générer automatiquement les tags et labels
      - name: Générer les métadonnées
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      # Construire et publier l'image
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer sur staging
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/tasks-api:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name tasks-api-staging -p 8000:8000 "$IMAGE"

      - name: Test de fumée
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer sur production
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$OWNER/tasks-api:$VERSION"
          docker pull "$IMAGE"
          docker run -d --name tasks-api-production -p 8000:8000 "$IMAGE"

      - name: Test de fumée
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/version



