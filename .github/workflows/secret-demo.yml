name: Secret Demo
on: push
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Tester le secret et la variable
        env: 
          DEMO_TOKEN: ${{ secret.DEMO_TOKEN }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Secret absent"
            exit 1
          fi

          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"
          echo "Environnement : ${{ vars.APP_ENV }}"